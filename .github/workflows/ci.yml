name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=1

  build-and-release:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          NAME="${RAW%%+*}"
          TAG="v${NAME}-b${GITHUB_RUN_NUMBER}"
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag $TAG"

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          TAG="${{ steps.version.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "release-assets/field_lens-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "release-assets/field_lens-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "release-assets/field_lens-${TAG}-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release-assets/field_lens-${TAG}.aab"

      - name: Upload APKs (Actions artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: field-lens-apks
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Upload App Bundle (Actions artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: field-lens-aab
          path: release-assets/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FieldLens ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
