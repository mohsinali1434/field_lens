name: field_lens
description: Offline-first field inspection and reporting application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  camera: ^0.12.0
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.0.1
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_map: ^8.1.1
  flutter_native_splash: ^2.4.8
  geolocator: ^14.0.2
  get_it: ^8.0.3
  go_router: ^16.0.0
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.5.4
  image_picker: ^1.1.2
  intl: ^0.20.3
  just_audio: ^0.10.4
  latlong2: ^0.9.1
  logger: ^2.5.0
  material_ui: ^1.1.0
  google_fonts: ^6.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  printing: ^5.14.2
  record: ^6.0.0
  share_plus: ^11.0.0
  signature: ^6.0.0
  sqlite3_flutter_libs: ^0.5.40
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: any
  plugin_platform_interface: any

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/app_icon.png
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#4F46E5"
  color_dark: "#4F46E5"
  image: assets/branding/splash_icon.png
  image_dark: assets/branding/splash_icon.png
  android: true
  ios: true
  web: false
  fullscreen: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#4F46E5"
    color_dark: "#4F46E5"
    image: assets/branding/splash_icon.png
    image_dark: assets/branding/splash_icon.png
    # Match splash color so Android's icon circle is never white.
    icon_background_color: "#4F46E5"
    icon_background_color_dark: "#4F46E5"
